<title>Mein Laptop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: ein Bildschirm – Menüleiste oben, Widgets links, Player + Ordner rechts, Dock unten, Fenster frei darüber */
:root{
  --ink:#ffffff;
  --ink-2:rgba(255,255,255,.74);
  --ink-3:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.085);
  --glass-2:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.14);
  --accent:#ff8a4c;
  --night:#161848;
  --win:rgba(30,32,78,.9);
  --win-solid:#23265a;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px);
  --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit;user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

#os{position:fixed;inset:0;overflow:hidden}
.wall{position:absolute;inset:0;transition:background .6s}
.wall[data-w="abend"]{background:
  radial-gradient(38% 46% at 7% 12%,rgba(205,84,62,.88),transparent 72%),
  radial-gradient(34% 42% at 88% 24%,rgba(112,72,224,.78),transparent 72%),
  radial-gradient(60% 48% at 52% 108%,rgba(8,122,204,.9),transparent 72%),
  linear-gradient(180deg,#1c1a4c,#171a4c 55%,#0f2c5e)}
.wall[data-w="ozean"]{background:
  radial-gradient(40% 50% at 15% 15%,rgba(20,170,190,.75),transparent 72%),
  radial-gradient(40% 45% at 85% 30%,rgba(40,90,220,.75),transparent 72%),
  radial-gradient(60% 50% at 50% 110%,rgba(10,200,170,.6),transparent 72%),
  linear-gradient(180deg,#0b1c3a,#0c2547 60%,#063a4f)}
.wall[data-w="polar"]{background:
  radial-gradient(40% 45% at 20% 10%,rgba(60,220,140,.6),transparent 72%),
  radial-gradient(35% 45% at 80% 20%,rgba(190,70,220,.65),transparent 72%),
  radial-gradient(60% 50% at 50% 110%,rgba(40,80,200,.8),transparent 72%),
  linear-gradient(180deg,#101433,#141a40 60%,#1a1650)}

/* Menüleiste */
.menubar{position:absolute;inset:0 0 auto;z-index:500;height:34px;padding-top:var(--top);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:4px;background:rgba(16,18,58,.42);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);font-size:13px;font-weight:600;box-sizing:content-box}
.logo-btn{width:22px;height:22px;border-radius:6px;background:#fff;display:grid;place-items:center;margin-right:10px}
.logo-btn span{width:8px;height:8px;border-radius:50%;border:2.5px solid #161848}
.mb-item{padding:4px 9px;border-radius:6px;font-weight:500;color:var(--ink)}
.mb-item.app{font-weight:700}
.mb-item:hover,.mb-item[aria-expanded="true"]{background:var(--glass-2)}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.mb-right .i{font-size:16px}
.mb-cc{width:26px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--glass-2)}
.mb-cc .i{font-size:14px}
.mb-dnd[hidden]{display:none}
#clockMb{white-space:nowrap}
.menu{position:absolute;z-index:600;min-width:210px;padding:6px;border-radius:10px;background:var(--win);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 50px rgba(0,0,0,.45);font-size:13px}
.menu button{display:flex;width:100%;justify-content:space-between;gap:20px;padding:7px 10px;border-radius:6px;text-align:left}
.menu button:hover{background:var(--accent);color:#fff}
.menu small{color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}

/* Schreibtisch */
.desk{position:absolute;inset:calc(34px + var(--top)) 0 calc(100px + var(--bot));
  padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));padding-block:36px 0;
  display:flex;justify-content:space-between;gap:24px;pointer-events:none}
.desk>*{pointer-events:auto}
.col-l{width:342px;display:flex;flex-direction:column;gap:22px}
.col-r{width:342px;display:flex;flex-direction:column;align-items:flex-end;gap:80px}
.card{border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.w-clock{padding:24px 26px 22px;background:linear-gradient(145deg,rgba(255,140,110,.16),rgba(255,255,255,.06))}
.w-clock .day{color:var(--accent);font-weight:600;font-size:15px}
.w-clock .time{font-size:76px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:8px 0 10px;font-variant-numeric:tabular-nums}
.w-clock .date{color:var(--ink-2);font-size:15px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.w-small{padding:18px 20px;min-height:160px;box-sizing:border-box;display:flex;flex-direction:column;text-align:left}
.w-weather .city{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.w-weather .temp{font-size:44px;font-weight:700;line-height:1.1}
.w-weather .cond{margin-top:auto;color:var(--ink-2);font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:6px}
.w-weather .cond .i{font-size:18px}
.w-bat .head{display:flex;justify-content:space-between;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ring{--p:82;width:84px;height:84px;margin:14px auto 0;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0)}
.ring::before{content:"";grid-area:1/1;width:72px;height:72px;border-radius:50%;background:#33264f}
.ring>span{grid-area:1/1;z-index:1;display:grid;font-size:24px}
.w-cal{padding:22px 20px 18px}
.w-cal .head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.w-cal .m{color:var(--accent);font-weight:700;font-size:15px}
.w-cal .y{color:var(--ink-2);font-size:13px;font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cal .dow{color:var(--ink-3);font-size:11px;padding-bottom:8px}
.cal span{height:30px;display:grid;place-items:center}
.cal .today{background:var(--accent);border-radius:999px;color:#2a1708;width:40px;margin:0 auto}

.w-music{width:100%;padding:18px 18px 16px;box-sizing:border-box}
.np{display:flex;gap:14px;align-items:center}
.cover{width:64px;height:64px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(140deg,#ff9a4c,#ff4f86)}
.cover>span{display:contents}
.cover .i{width:42%;height:42%}
.np small{font-size:11px;font-weight:600;color:var(--ink-2)}
.np b{display:block;font-size:16px;font-weight:700;margin:2px 0 1px}
.np span{color:var(--ink-2);font-size:13px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.22);margin:18px 0 6px;overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;background:#fff;border-radius:4px;width:0}
.times{display:flex;justify-content:space-between;font-size:10px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ctrls{display:flex;justify-content:center;align-items:center;gap:44px;margin-top:6px}
.ctrls button{font-size:20px;display:grid;place-items:center}
.ctrls .pp{width:52px;height:52px;border-radius:50%;background:#fff;color:#161848;font-size:20px}

.dicons{display:flex;flex-direction:column;gap:22px;margin-right:6px}
.dicon{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;font-size:12px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.4);border-radius:10px;padding:4px 0}
.dicon:hover{background:rgba(255,255,255,.08)}
.dicon .ico{width:64px;height:52px;border-radius:14px}

/* App-Icons */
.ico{display:grid;place-items:center;background:linear-gradient(165deg,var(--c1),var(--c2));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.25)}
.ico .i{width:44%;height:44%}

/* Dock */
.dock{position:absolute;left:50%;bottom:calc(14px + var(--bot));transform:translateX(-50%);z-index:400;display:flex;align-items:flex-end;gap:8px;padding:9px 10px 11px;border-radius:24px;
  background:rgba(120,150,230,.16);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);max-width:calc(100vw - 32px);box-sizing:border-box}
.dock .slot{position:relative;display:flex;flex-direction:column;align-items:center}
.dock .ico{width:52px;height:52px;border-radius:13px;transition:transform .18s}
.dock .slot:hover .ico{transform:translateY(-6px) scale(1.08)}
.dock .dot{position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:0}
.dock .slot.run .dot{opacity:1}
.dock .sep{width:1px;align-self:stretch;margin:6px 6px;background:rgba(255,255,255,.3)}
.dock .tip{position:absolute;bottom:72px;padding:4px 9px;border-radius:7px;background:var(--win-solid);font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.dock .slot:hover .tip{opacity:1}

/* Fenster */
#wins{position:absolute;inset:0;pointer-events:none;z-index:100}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--win);border:1px solid var(--line);
  backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s ease-out}
.win.max{left:0!important;top:calc(34px + var(--top))!important;width:100%!important;height:calc(100% - 34px - var(--top) - 96px - var(--bot))!important;border-radius:0}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.tbar{height:40px;flex:none;display:flex;align-items:center;padding:0 14px;cursor:grab;position:relative;border-bottom:1px solid var(--line);touch-action:none}
.tbar:active{cursor:grabbing}
.lights{display:flex;gap:8px;z-index:1}
.lights button{width:13px;height:13px;border-radius:50%}
.l-close{background:#ff5f57}.l-min{background:#febc2e}.l-max{background:#28c840}
.ttl{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink-2);pointer-events:none}
.wbody{flex:1;min-height:0;overflow:auto;font-size:14px;user-select:text}
.pad{padding:18px}
.muted{color:var(--ink-3)}
.btn{padding:8px 14px;border-radius:9px;background:var(--glass-2);font-weight:600;font-size:13px}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.acc{background:var(--accent);color:#2a1708}
.field{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.2);outline:none}
.field:focus{border-color:var(--accent)}
.side{display:grid;grid-template-columns:180px 1fr;height:100%}
.side nav{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:rgba(0,0,0,.12);overflow:auto}
.side nav button{text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:9px;align-items:center;font-size:13px;font-weight:500}
.side nav button.on{background:var(--glass-2)}
.side nav .i{font-size:15px;color:#62b6ff}
.side>div{min-width:0;overflow:auto}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--ink-3);padding:24px}
.empty .ico{width:72px;height:72px;border-radius:18px;margin:0 auto 14px}

/* Launcher */
#launcher{position:absolute;inset:0;z-index:700;background:rgba(12,14,46,.45);backdrop-filter:blur(30px) saturate(1.2);-webkit-backdrop-filter:blur(30px) saturate(1.2);display:flex;flex-direction:column;align-items:center;padding-top:calc(80px + var(--top));animation:fade .2s}
@keyframes fade{from{opacity:0}}
.search{width:min(360px,calc(100vw - 32px));height:44px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.pages{width:min(1100px,100vw);overflow:hidden;margin-top:56px}
.track{display:flex;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
.grid{flex:0 0 100%;display:grid;grid-template-columns:repeat(7,1fr);row-gap:34px;justify-items:center;align-content:start;padding:0 16px;box-sizing:border-box}
.gapp{display:flex;flex-direction:column;align-items:center;gap:10px;width:130px;font-size:13px;font-weight:600;border-radius:14px;padding:6px 0}
.gapp .ico{width:88px;height:88px;border-radius:22px;transition:transform .15s}
.gapp:hover .ico{transform:scale(1.06)}
.dots{display:flex;gap:10px;margin-top:40px}
.dots button{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots button.on{background:#fff}
.noresult{grid-column:1/-1;color:var(--ink-2)}

/* Kontrollzentrum */
#cc{position:absolute;z-index:650;top:calc(44px + var(--top));right:max(16px,env(safe-area-inset-right,0px));width:380px;max-width:calc(100vw - 32px);box-sizing:border-box;padding:18px;border-radius:30px;
  background:rgba(40,40,100,.45);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(34px) saturate(1.3);-webkit-backdrop-filter:blur(34px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.45);display:grid;gap:14px;animation:pop .18s}
.cc-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:20px;background:rgba(255,255,255,.1)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;justify-items:center}
.tg{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:20px;transition:background .2s}
.tg[aria-pressed="true"]{background:var(--accent)}
.mini{padding:14px;display:flex;flex-direction:column;gap:10px}
.mini .cover{width:44px;height:44px;border-radius:10px;font-size:18px}
.mini b{font-size:14px;line-height:1.2}
.mini span{font-size:12px;color:var(--ink-2)}
.mini .ctrls{gap:22px;margin:0;justify-content:space-around}
.mini .ctrls button{font-size:14px}
.wide{display:flex;align-items:center;gap:10px;padding:16px;font-weight:600;font-size:14px;text-align:left}
.wide .i{font-size:18px}
.wide[aria-pressed="true"]{background:var(--accent)}
.sl{padding:12px 14px 14px}
.sl label{display:block;font-weight:600;font-size:13px;margin-bottom:9px}
.range{position:relative;height:34px;border-radius:999px;background:rgba(255,255,255,.2);overflow:hidden;touch-action:none;cursor:pointer}
.range i{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:999px}
.range .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#161848;font-size:16px;z-index:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.quick button{height:72px;border-radius:20px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px}
.quick button[aria-pressed="true"]{background:#fff;color:#161848}
.cc-close{justify-self:center;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:600;font-size:13px}

#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:900;transition:opacity .15s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:901}
#flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
#toast{position:absolute;left:50%;top:calc(50px + var(--top));transform:translateX(-50%);z-index:902;padding:10px 16px;border-radius:12px;background:var(--win-solid);border:1px solid var(--line);font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* App-Inhalte */
.calc{display:flex;flex-direction:column;height:100%;background:rgba(0,0,0,.18)}
.calc .disp{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px 18px;font-size:46px;font-weight:300;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(0,0,0,.25)}
.calc .keys button{height:54px;background:rgba(255,255,255,.1);font-size:19px;font-weight:500}
.calc .keys button:hover{background:rgba(255,255,255,.18)}
.calc .keys .op{background:#f59a2a}
.calc .keys .op:hover{background:#ffad48}
.calc .keys .fn{background:rgba(255,255,255,.2)}
.calc .keys .zero{grid-column:span 2}
.term{height:100%;box-sizing:border-box;padding:12px 14px;background:rgba(6,8,22,.75);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:auto;color:#d6e2ff}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .pr{color:#7ee787}
.term .in{display:flex;gap:8px}
.term input{flex:1;background:none;border:0;outline:none;font-family:var(--mono);font-size:13px;color:#fff}
.notes{width:100%;height:100%;box-sizing:border-box;border:0;outline:none;resize:none;padding:20px;background:linear-gradient(rgba(255,213,74,.06),rgba(255,213,74,.02));font-size:15px;line-height:1.6}
.todo li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo ul{list-style:none;margin:12px 0 0;padding:0}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.todo li.done span{text-decoration:line-through;color:var(--ink-3)}
.todo li span{flex:1}
.todo .del{color:var(--ink-3);font-size:16px}
.ttt{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center;margin:16px 0}
.ttt button{height:84px;border-radius:14px;background:var(--glass-2);font-size:38px;font-weight:800}
.ttt button.x{color:var(--accent)}.ttt button.o{color:#7aa8ff}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px;padding:18px}
.file{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;text-align:center;word-break:break-word;padding:8px 4px;border-radius:10px}
.file:hover{background:var(--glass)}
.file .ico{width:52px;height:52px;border-radius:12px}
.list button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.list button.on{background:var(--glass-2)}
.list b{display:block;font-size:13px}
.list small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:75%;padding:9px 13px;border-radius:18px;background:var(--glass-2);font-size:14px;line-height:1.4;align-self:flex-start}
.bub.me{align-self:flex-end;background:#2f7bf5}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:6px}
.photos button{aspect-ratio:1;border-radius:6px;max-width:100%}
.bigcal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.bigcal div{background:var(--win-solid);min-height:62px;padding:6px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.bigcal .dow{min-height:auto;color:var(--ink-3);font-weight:600;text-align:center}
.bigcal .out{color:var(--ink-3)}
.bigcal .td b{background:var(--accent);color:#2a1708;border-radius:999px;padding:1px 7px}

  $('#clockMb').textContent = `${DSH[d.getDay()]} ${d.getDate()}. ${MSH[d.getMonth()]}  ${hm(d)}`;
  $('#wDay').textContent = DAYS[d.getDay()];
  $('#wTime').textContent = hm(d);
  $('#wDate').textContent = `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if (d.getDate() !== lastDay){ lastDay = d.getDate(); miniCal(d); }
  $$('[data-live]').forEach(e => e.textContent = e.dataset.live === 'sec' ? `${hm(d)}:${pad2(d.getSeconds())}` : hm(d));
  $$('[data-tz]').forEach(e => e.textContent = d.toLocaleTimeString('de-DE',{timeZone:e.dataset.tz,hour:'2-digit',minute:'2-digit'}));
}
function monthCells(y, m){
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, n = new Date(y, m+1, 0).getDate();
  return {lead, n};
}
function miniCal(d){
  const y = d.getFullYear(), m = d.getMonth(), {lead, n} = monthCells(y, m);
  $('#calM').textContent = MONTHS[m]; $('#calY').textContent = y;
  let h = ['M','D','M','D','F','S','S'].map(x => `<span class="dow">${x}</span>`).join('');
  h += '<span></span>'.repeat(lead);
  for (let i = 1; i <= n; i++) h += `<span class="${i === d.getDate() ? 'today' : ''}">${i}</span>`;
  $('#calGrid').innerHTML = h;
}

/* ---------- Musik ---------- */
const TRACKS = [
  {t:'Nordlicht', a:'Lumen', d:215},
  {t:'Stadt bei Nacht', a:'Kova', d:188},
  {t:'Blaue Stunde', a:'Aria Nord', d:242},
  {t:'Kupferhimmel', a:'Die Weite', d:201},
  {t:'Leise Wellen', a:'Mare', d:176}
];
const mus = {i:0, pos:84, play:true};
const fmt = s => `${Math.floor(s/60)}:${pad2(Math.floor(s%60))}`;
function renderMusic(){
  const tr = TRACKS[mus.i];
  $$('.mTitle').forEach(e => e.textContent = tr.t);
  $$('.mArtist').forEach(e => e.textContent = tr.a);
  $$('.mPos').forEach(e => e.textContent = fmt(mus.pos));
  $$('.mRem').forEach(e => e.textContent = '-' + fmt(tr.d - mus.pos));
  $$('.mBar i').forEach(e => e.style.width = (mus.pos / tr.d * 100) + '%');
  $$('.mPlay').forEach(e => e.innerHTML = ic(mus.play ? 'pause' : 'play'));
  $$('[data-track]').forEach(e => e.classList.toggle('on', +e.dataset.track === mus.i));
  setRun('musik');
}
function skip(dir){ mus.i = (mus.i + dir + TRACKS.length) % TRACKS.length; mus.pos = 0; renderMusic(); }
document.addEventListener('click', e => {
  const b = e.target.closest('.mPlay,.mPrev,.mNext,.mBar,[data-track]');
  if (!b) return;
  if (b.matches('.mPlay')) mus.play = !mus.play;
  else if (b.matches('.mPrev')) return skip(-1);
  else if (b.matches('.mNext')) return skip(1);
  else if (b.matches('.mBar')){ const r = b.getBoundingClientRect(); mus.pos = Math.round((e.clientX - r.left) / r.width * TRACKS[mus.i].d); }
  else { mus.i = +b.dataset.track; mus.pos = 0; mus.play = true; }
  renderMusic();
});
$$('.mPrev').forEach(e => e.innerHTML = ic('prev'));
$$('.mNext').forEach(e => e.innerHTML = ic('next'));
setInterval(() => { if (!mus.play) return; mus.pos++; if (mus.pos >= TRACKS[mus.i].d) skip(1); else renderMusic(); }, 1000);

/* ---------- Fenster ---------- */
const wins = {};
let z = 10, cascade = 0;
const SIZES = {rechner:[320,470], uhr:[520,470], spiele:[380,470], notizen:[520,460], wetter:[560,430], musik:[560,460], einstellungen:[560,500], terminal:[640,420], kamera:[520,420]};
function openApp(id, arg){
  closeOverlays();
  const a = APP[id]; if (!a) return;
  if (wins[id]){ const w = wins[id]; w.hidden = false; focusWin(id); if (arg != null && w._arg) w._arg(arg); return; }
  const [W0, H0] = SIZES[id] || [700, 470];
  const W = Math.min(W0, innerWidth - 24), H = Math.min(H0, innerHeight - 150);
  const w = document.createElement('section');
  w.className = 'win'; w.dataset.app = id;
  w.setAttribute('role','dialog'); w.setAttribute('aria-label', a.name);
  const off = (cascade++ % 6) * 28;
  w.style.cssText = `width:${W}px;height:${H}px;left:${Math.max(12,(innerWidth-W)/2 - 80 + off)}px;top:${Math.max(50,(innerHeight-H)/2 - 60 + off)}px`;
  w.innerHTML = `<div class="tbar"><div class="lights"><button class="l-close" aria-label="Schließen"></button><button class="l-min" aria-label="Minimieren"></button><button class="l-max" aria-label="Maximieren"></button></div><div class="ttl">${a.name}</div></div><div class="wbody"></div>`;
  $('#wins').append(w);
  wins[id] = w;
  (BUILD[id] || placeholder)($('.wbody', w), a, arg, w);
  focusWin(id); setRun(id); drag(w);
  $('.l-close', w).onclick = () => closeWin(id);
  $('.l-min', w).onclick = () => { w.hidden = true; topApp(); };
  $('.l-max', w).onclick = () => w.classList.toggle('max');
  $('.tbar', w).ondblclick = e => { if (!e.target.closest('button')) w.classList.toggle('max'); };
  w.addEventListener('pointerdown', () => focusWin(id));
}
function closeWin(id){ const w = wins[id]; if (!w) return; w._close && w._close(); w.remove(); delete wins[id]; setRun(id); topApp(); }
function focusWin(id){ wins[id].style.zIndex = ++z; $('#mbApp').textContent = APP[id].name; }
function topApp(){
  const open = Object.values(wins).filter(w => !w.hidden).sort((a,b) => b.style.zIndex - a.style.zIndex);
  $('#mbApp').textContent = open[0] ? APP[open[0].dataset.app].name : 'Dateien';
}
function drag(w){
  const bar = $('.tbar', w); let sx, sy, ox, oy;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || w.classList.contains('max') || innerWidth <= 860) return;
    sx = e.clientX; sy = e.clientY; ox = w.offsetLeft; oy = w.offsetTop; bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove', e => {
    if (sx == null) return;
    w.style.left = Math.min(innerWidth - 80, Math.max(-w.offsetWidth + 80, ox + e.clientX - sx)) + 'px';
    w.style.top = Math.min(innerHeight - 60, Math.max(34, oy + e.clientY - sy)) + 'px';
  });
  bar.addEventListener('pointerup', () => sx = null);
}

/* ---------- Launcher ---------- */
let page = 0;
const PAGES = [APPS.slice(0,21), APPS.slice(21)];
function renderLauncher(q=''){
  const t = $('#track'); q = q.trim().toLowerCase();
  if (q){
    const hits = APPS.filter(a => a.name.toLowerCase().includes(q));
    t.innerHTML = `<div class="grid">${hits.map(gapp).join('') || `<p class="noresult">Keine App gefunden für „${esc(q)}“.</p>`}</div>`;
    t.style.transform = ''; $('#dots').hidden = true; return;
  }
  t.innerHTML = PAGES.map(p => `<div class="grid">${p.map(gapp).join('')}</div>`).join('');
  $('#dots').hidden = false;
  $('#dots').innerHTML = PAGES.map((_,i) => `<button class="${i===page?'on':''}" data-page="${i}" aria-label="Seite ${i+1}"></button>`).join('');
  t.style.transform = `translateX(${-page*100}%)`;
}
function gapp(a){ return `<button class="gapp" data-open="${a.id}">${icoHTML(a)}${a.name}</button>`; }
function setPage(p){ page = Math.max(0, Math.min(PAGES.length-1, p)); renderLauncher(); }
function openLauncher(){ closeOverlays(); page = 0; $('#q').value = ''; renderLauncher(); $('#launcher').hidden = false; setTimeout(() => $('#q').focus(), 30); }
$('#q').addEventListener('input', e => renderLauncher(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter'){ const f = $('#track [data-open]'); if (f) openApp(f.dataset.open); } });
$('#dots').addEventListener('click', e => { const b = e.target.closest('[data-page]'); if (b) setPage(+b.dataset.page); });
$('#launcher').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.matches('.pages,.grid')) closeOverlays(); });
let wheelLock = 0;
$('#launcher').addEventListener('wheel', e => {
  if ($('#q').value || Date.now() < wheelLock) return;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (Math.abs(d) > 20){ setPage(page + Math.sign(d)); wheelLock = Date.now() + 500; }
}, {passive:true});
let tx = null;
$('#launcher').addEventListener('pointerdown', e => tx = e.clientX);
$('#launcher').addEventListener('pointerup', e => { if (tx != null && Math.abs(e.clientX - tx) > 60) setPage(page + (e.clientX < tx ? 1 : -1)); tx = null; });
$('#logoBtn').onclick = () => $('#launcher').hidden ? openLauncher() : closeOverlays();

  $('#mbWifi').innerHTML = ic($('#tgWifi').getAttribute('aria-pressed') === 'true' ? 'wifi' : 'wifiOff');

function renderDim(){
  const torch = $('#qTorch').getAttribute('aria-pressed') === 'true';
  $('#dim').style.opacity = torch ? .18 : Math.pow(1 - Math.max(.15, cc.bright), 2) * .8;
}
function slider(el, key){
  const set = x => { const r = el.getBoundingClientRect(); cc[key] = Math.min(1, Math.max(0, (x - r.left) / r.width)); renderStatus(); syncSettings(); };
  el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); set(e.clientX); el.onpointermove = ev => set(ev.clientX); });
  el.addEventListener('pointerup', () => el.onpointermove = null);
  el.addEventListener('keydown', e => { const d = {ArrowRight:.05, ArrowUp:.05, ArrowLeft:-.05, ArrowDown:-.05}[e.key]; if (d){ cc[key] = Math.min(1, Math.max(0, cc[key] + d)); renderStatus(); e.preventDefault(); } });
}

};
function topWin(){ const o = Object.values(wins).filter(w => !w.hidden).sort((a,b) => b.style.zIndex - a.style.zIndex)[0]; return o && o.dataset.app; }
let menuEl = null;
$$('[data-menu]').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  const was = b.getAttribute('aria-expanded') === 'true'; closeOverlays(); if (was) return;
  b.setAttribute('aria-expanded', 'true');
  menuEl = document.createElement('div'); menuEl.className = 'menu';
  const r = b.getBoundingClientRect(); menuEl.style.left = r.left + 'px'; menuEl.style.top = (r.bottom + 4) + 'px';
  MENUS[b.dataset.menu].forEach(it => {
    if (it === '-'){ menuEl.append(document.createElement('hr')); return; }
    const [label, hint, fn] = typeof it[1] === 'function' ? [it[0], '', it[1]] : it;
    const x = document.createElement('button'); x.innerHTML = `<span>${label}</span><small>${hint}</small>`;
    x.onclick = () => { closeOverlays(); fn(); }; menuEl.append(x);
  });
  $('#os').append(menuEl);
}));
function fullscreen(){
  try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => toast('Vollbild ist hier nicht verfügbar')); }
  catch{ toast('Vollbild ist hier nicht verfügbar'); }
}
function closeOverlays(){
  $('#launcher').hidden = true; $('#cc').hidden = true;
  if (menuEl){ menuEl.remove(); menuEl = null; }
  $$('[data-menu]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]');
  if (o){ openApp(o.dataset.open); return; }
  const f = e.target.closest('[data-folder]');
  if (f){ openApp('dateien', f.dataset.folder); return; }
  if (menuEl && !e.target.closest('.menu')) closeOverlays();
  if (!$('#cc').hidden && !e.target.closest('#cc,#ccBtn')) closeOverlays();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.code === 'Space'){ e.preventDefault(); $('#launcher').hidden ? openLauncher() : closeOverlays(); return; }
  if (e.key === 'Escape'){
    if (!$('#launcher').hidden || !$('#cc').hidden || menuEl) closeOverlays();
    else { const t = topWin(); if (t) closeWin(t); }
  }
  if (!$('#launcher').hidden && !$('#q').value){ if (e.key === 'ArrowRight') setPage(page+1); if (e.key === 'ArrowLeft') setPage(page-1); }
});

  spiele(b){
    let bd, over; const L = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const win = p => L.some(l => l.every(i => bd[i] === p));
    const pick = () => {
      const free = bd.map((v,i) => v ? -1 : i).filter(i => i >= 0);
      for (const p of ['O','X']) for (const i of free){ bd[i] = p; const w = win(p); bd[i] = ''; if (w) return i; }
      if (!bd[4]) return 4; return free[Math.floor(Math.random()*free.length)];
    };
    const r = msg => {
      b.innerHTML = `<div class="pad" style="text-align:center"><b style="font-size:17px">Tic-Tac-Toe</b><p class="muted" style="margin:4px 0 0">${msg}</p><div class="ttt">${bd.map((v,i) => `<button class="${v.toLowerCase()}" data-c="${i}" aria-label="Feld ${i+1}">${v}</button>`).join('')}</div><button class="btn" id="rs">Neues Spiel</button></div>`;
      $$('[data-c]', b).forEach(x => x.onclick = () => move(+x.dataset.c)); $('#rs', b).onclick = start;
    };
    const move = i => {
      if (over || bd[i]) return; bd[i] = 'X';
      if (win('X')){ over = 1; return r('Du hast gewonnen!'); }
      if (bd.every(Boolean)){ over = 1; return r('Unentschieden.'); }
      bd[pick()] = 'O';
      if (win('O')){ over = 1; return r('Der Computer gewinnt.'); }
      if (bd.every(Boolean)){ over = 1; return r('Unentschieden.'); }
      r('Du bist dran (X).');
    };

    const say = (t, cls='') => { const d = document.createElement('div'); d.className = 'ln ' + cls; d.textContent = t; out.append(d); term.scrollTop = 1e6; };
    say('Willkommen. Tippe „hilfe“ für eine Liste der Befehle.');
    const CMD = {
      hilfe: () => 'Befehle: hilfe, datum, ls, whoami, echo <text>, öffne <app>, info, clear',
      datum: () => new Date().toLocaleString('de-DE', {dateStyle:'full', timeStyle:'medium'}),

      'öffne': a => { const x = APPS.find(p => p.name.toLowerCase() === a.toLowerCase() || p.id === a.toLowerCase()); if (!x) return `App „${a}“ nicht gefunden.`; setTimeout(() => openApp(x.id)); return `Öffne ${x.name} …`; }
    };
    CMD.help = CMD.hilfe; CMD.date = CMD.datum; CMD.open = CMD['öffne'];
    inp.onkeydown = e => {
      if (e.key !== 'Enter') return;
      const line = inp.value; inp.value = ''; say('du@laptop ~ % ' + line, 'pr');
      const [c, ...rest] = line.trim().split(/\s+/); if (!c) return;
      const f = CMD[c.toLowerCase()]; const res = f ? f(rest.join(' ')) : `Befehl nicht gefunden: ${c}`;

  rechner(b){
    let cur = '0', prev = null, op = null, fresh = true;
    b.innerHTML = `<div class="calc"><div class="disp" aria-live="polite">0</div><div class="keys">${
      [['C','fn'],['±','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0','zero'],[','],['=','op']]
      .map(([k,c='']) => `<button class="${c}" data-k="${k}">${k}</button>`).join('')}</div></div>`;
    const disp = $('.disp', b);
    const show = () => disp.textContent = cur.replace('.', ',');
    const num = () => parseFloat(cur);
    const calc = (a, o, c) => o === '+' ? a + c : o === '−' ? a - c : o === '×' ? a * c : c === 0 ? NaN : a / c;
    const out = v => isFinite(v) ? String(+v.toPrecision(12)) : 'Fehler';
    const key = k => {
      if (/\d/.test(k)){ cur = fresh || cur === '0' ? k : cur + k; fresh = false; }
      else if (k === ','){ if (fresh){ cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.'; }
      else if (k === 'C'){ cur = '0'; prev = null; op = null; fresh = true; }
      else if (k === '±'){ cur = out(-num()); }
      else if (k === '%'){ cur = out(num() / 100); }
      else if (k === '='){ if (op != null){ cur = out(calc(prev, op, num())); prev = null; op = null; fresh = true; } }
      else { if (op != null && !fresh) cur = out(calc(prev, op, num())); prev = num(); op = k; fresh = true; }
      show();
    };
    $('.keys', b).onclick = e => { const k = e.target.closest('[data-k]'); if (k) key(k.dataset.k); };
    const kb = e => { if (wins.rechner?.style.zIndex != z) return; const m = {'/':'÷','*':'×','-':'−','+':'+','Enter':'=','=':'=',',':',','.':',','Backspace':'C','Delete':'C'}; const k = /^\d$/.test(e.key) ? e.key : m[e.key]; if (k){ key(k); e.preventDefault(); } };
    document.addEventListener('keydown', kb); wins.rechner._close = () => document.removeEventListener('keydown', kb);
  },

  einstellungen(b){

    const v = $('#vv', b); let A = 0, B = 0, loop = false, url;
    const ui = () => { const d = v.duration || 1; $('#vtl i', b).style.left = (A/d*100) + '%'; $('#vtl i', b).style.right = (100 - B/d*100) + '%'; $('#vtl b', b).style.left = (v.currentTime/d*100) + '%'; $('#vinfo', b).textContent = `Schnitt: ${fmt(A)} – ${fmt(B)} (${fmt(B - A)})`; };
    $('#vf', b).onchange = e => { const f = e.target.files[0]; if (!f) return; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(f); v.src = url; $('#ved', b).hidden = false; $('#vh', b).textContent = f.name; };
    v.onloadedmetadata = () => { A = 0; B = v.duration; ui(); };
    v.ontimeupdate = () => { if (loop && v.currentTime >= B){ v.pause(); loop = false; } ui(); };
    $('#vin', b).onclick = () => { A = Math.min(v.currentTime, B); ui(); };
    $('#vout', b).onclick = () => { B = Math.max(v.currentTime, A); ui(); };
    $('#vplay', b).onclick = () => { v.currentTime = A; loop = true; v.play(); };
    $('#vtl', b).onclick = e => { const r = e.currentTarget.getBoundingClientRect(); v.currentTime = (e.clientX - r.left) / r.width * (v.duration || 0); };

  }

function applyWall(k){ $('#wall').dataset.w = k; store.set('wall', k); }

/* ---------- Start ---------- */

applyAccent(store.get('accent', '#ff8a4c'));
tick(); setInterval(tick, 1000);
renderMusic(); renderStatus();
})();
